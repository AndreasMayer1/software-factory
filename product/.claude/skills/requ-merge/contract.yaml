contract_version: 1
skill: requ-merge
purpose: >
  Merge all markdown files from requirements_general_overview/ and
  requirements_tasks/ into a single requirements.md file in the project root
  by running scripts/artifacts/merge_requirements.py.

derived_from:
  required:
    - path: requirements
      source: skill:requ-explore
      reason: All per-feature requirement files merged into the output.
    - path: requirements
      source: external
      reason: General overview markdown files included in the merge.

produces:
  required:
    - path: requirements
      reason: Generated merged requirements file — DO NOT edit manually.

quality_criteria:
  - merge_requirements.py is the only permitted mechanism; never edit requirements.md directly.

may_invoke: []

side_effects:
  - target: requirements.md
    action: regenerate
    note: Generated by scripts/artifacts/merge_requirements.py.

preconditions: []

postconditions:
  - requirements.md is up to date and reflects all current per-feature requirements files.
