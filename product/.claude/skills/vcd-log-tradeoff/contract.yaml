contract_version: 1
skill: vcd-log-tradeoff
purpose: >
  Document a Value Trade-off Record (VTR) inline in an artifact when persona
  values conflict. Assigns the next sequential VTR-NNN ID, generates the
  canonical record from persona VCD blocks, inserts it under ## Value Trade-offs
  in the target artifact, and runs aggregate_value_tradeoffs.py.

derived_from:
  required:
    - path: persona
      source: external
      reason: VCD blocks (primary_value, secondary_values, value_conflicts) read for all involved personas.
    - path: value-tradeoff
      source: external
      reason: Canonical VTR template — all fields and format governed by this file.
  optional:
    - path: flow
      source: external
      reason: Target artifact when triggered from a flow context.
    - path: requirements
      source: skill:requ-explore
      reason: Target artifact when triggered from a requirement context.
    - path: guideline
      source: external
      reason: Target artifact when triggered from a design rule context.

produces:
  required:
    - path: value-tradeoff
      reason: VTR record inserted inline — never as a separate file.
  conditional:
    - path: value-tradeoff
      condition: regenerated by aggregate_value_tradeoffs.py after every VTR insertion.
      reason: Aggregate summary kept current across all VTRs.

quality_criteria:
  - VTR ID is sequential (VTR-NNN) and not already used in any artifact.
  - User must select an option before the record is written (AI never auto-resolves conflicts).
  - decision_status is decided when user chose; open when deferred.
  - decided_by is user when explicitly chosen; ai_recommended when user accepted AI proposal unchanged.
  - VTR is always inserted inline — a separate file is never created.
  - If triggered from code, a WHY comment referencing the VTR-NNN is required at the code location.

may_invoke: []

side_effects:
  - target: <target artifact>
    action: write
    note: ## Value Trade-offs section appended with the new VTR record.
  - target: requirements_user_needs/_meta/value_tradeoff_summary.md
    action: regenerate
    note: Regenerated by aggregate_value_tradeoffs.py after insertion.

preconditions:
  - A conflict between persona values has been identified.
  - User has been presented with options and has made a decision (or deferred).

postconditions:
  - VTR-NNN record exists inline in the target artifact.
  - value_tradeoff_summary.md is up to date.
