contract_version: 1
skill: doc-update-tokens
purpose: >
  Assist developers with creating design tokens and managing the token build
  workflow. Reads tokens.json, adds new tokens in W3C DTCG format, runs the
  process_design_tokens.dart build, and verifies compilation.

derived_from:
  required:
    - path: token-source
      source: external
      reason: The design token source file — always read before adding any token to understand current structure.

produces:
  required:
    - path: token-source
      reason: Updated token source with the new token(s) in the correct hierarchy position.
    - path: token-dart
      reason: Generated Dart token constants — regenerated by process_design_tokens.dart.
    - path: token-dart
      reason: Generated animation token constants — regenerated by process_design_tokens.dart.

quality_criteria:
  - tokens.json is always read before modification.
  - Existing tokens are never removed without explicit user confirmation.
  - process_design_tokens.dart is run after every tokens.json change.
  - flutter analyze reports no errors after generation.
  - Token names use kebab-case in JSON (converted to camelCase in Dart).

may_invoke: []

side_effects:
  - target: lib/config/theme/tokens.json
    action: write
    note: New token(s) added.
  - target: lib/config/theme/tokens.g.dart
    action: regenerate
    note: Regenerated by process_design_tokens.dart after tokens.json change.
  - target: lib/config/theme/animation_tokens.g.dart
    action: regenerate
    note: Regenerated by process_design_tokens.dart after tokens.json change.

preconditions:
  - User has described the token need (type, semantic purpose, theme applicability).

postconditions:
  - New token exists in tokens.json, generated Dart files are updated, and flutter analyze is clean.
