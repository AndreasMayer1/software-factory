contract_version: 1
skill: ux-write-canon-concept
purpose: >
  Sole gatekeeper for the concept canon — the PRODUCER of concept_canon.yaml, consulted
  by every authoring path that emits user-facing language. Adds, updates, upgrades
  provenance of, or renames canonical concepts, then regenerates the human-readable and
  index views.

derived_from:
  required:
    - path: concept-canon
      source: external
      schema: .claude/schemas/concept_canon_entry.yaml
      reason: >
        The authoritative canon this skill both reads and rewrites. Pre-exists on disk
        (bootstrap or prior runs), so treated as external rather than a cross-skill input.
  optional:
    - path: persona
      source: external
      reason: Register/audience evidence when authoring audience_variants.
    - path: scenario
      source: external
      reason: Provenance sources when upgrading evidence level.

produces:
  required:
    - path: concept-canon
      schema: .claude/schemas/concept_canon_entry.yaml
      reason: >
        Authoritative canon — appended/edited entry per concept_canon_entry.yaml.
        Consumed by requ-explore, ux-create-flow, ux-write-scenario, code-* (Sketch Gate),
        ui-scribble-iterate, product-intake, and check_canon.py.
    - path: concept-canon
      reason: Generated human-readable view (regenerated; do not hand-edit).
    - path: concept-canon-index
      reason: Generated lightweight existence-check lookup (regenerated; do not hand-edit).

quality_criteria:
  - The added/updated entry conforms to concept_canon_entry.yaml (required keys present, enums valid).
  - Concept ID follows CONCEPT-<UPPER-KEBAB> and is unique in concept_canon.yaml.
  - A canonical-name rename keeps the original ID and pushes the old name to aliases.legacy.
  - concept_canon.md and concept_canon.index.yaml are regenerated after every write.
  - The .canon-lock file is released on every exit path (success or failure).

may_invoke:
  - task-create # rename cascade touching > 10 files — create an impl task instead of inline edits

side_effects:
  - target: requirements_user_needs/concept_canon/.canon-lock
    action: write
    note: Advisory lock acquired before any write; removed on exit (success or failure).
  - target: requirements_user_needs/concept_canon/concept_canon.md
    action: regenerate
    note: Regenerated by generate_concept_canon_md.py after each write.
  - target: requirements_user_needs/concept_canon/concept_canon.index.yaml
    action: regenerate
    note: Regenerated by generate_concept_canon_md.py after each write.

preconditions:
  - concept_canon.yaml exists (possibly empty during bootstrap — callers degrade gracefully).
  - The .canon-lock file is absent (no other session is editing the canon).

postconditions:
  - concept_canon.yaml contains the added/updated entry conforming to concept_canon_entry.yaml.
  - The generated .md and .index.yaml views are in sync with concept_canon.yaml.
  - The .canon-lock file has been released.
