contract_version: 1
skill: task-create
purpose: >
  Initialize a task workspace inside requirements_tasks/ — the primary PRODUCER of
  goal.md, the most widely consumed artifact in the factory. Validates requirement
  coverage, allocates a unique task ID atomically, and writes the canonical goal.md
  frontmatter + body plus an empty plans_and_protocols/ memory home.

derived_from:
  required:
    - path: requirements
      source: skill:requ-explore
      schema: .claude/schemas/requirements_frontmatter.yaml
      reason: >
        Parent requirement — reads id, trackable_items.acceptance_criteria, urgency,
        impact for inheritance. Produced by requ-explore (or pre-authored, then governed
        by requ-explore for edits).
    - path: id-registry
      source: external
      reason: >
        Requirement ID lookup; regenerated just-in-time by generate_id_registry.py
        before task ID allocation. Generated by a script, not a skill.
  optional:
    - path: release-backlog
      source: external
      reason: Developer-maintained release plan; supplies package IDs for target_package.
    - path: flow
      source: external
      reason: review_status check when the task implements a user flow.
    - path: cascade-log
      source: external
      reason: >
        Cascade context for cascade-type tasks. Written by this skill on a prior run;
        pre-exists on disk, so treated as external rather than a cross-skill dependency.

produces:
  required:
    - path: goal
      schema: .claude/schemas/goal_metadata.yaml
      reason: >
        THE primary shared artifact consumed by every skill that executes work.
        Frontmatter carries task_id, type, parent_requirement, covers, effort, status,
        after, opus_recommended, and every other goal_metadata field.
    - path: plans-dir
      reason: Empty directory — cross-session memory home for all protocol.md and plan files.
  conditional:
    - path: cascade-log
      condition: written only when cascade_type == user_needs and multi-pass mode is confirmed.
      reason: Cascade pass tracker; read by each cascade pass agent before starting.
    - path: user-input
      condition: written only when task type == explore.
      reason: Verbatim user seed input; referenced from goal.md Background.

quality_criteria:
  - goal.md exists at the declared path with valid YAML frontmatter after the skill exits.
  - task_id matches TASK-[CATEGORY]-[REQ_NUM]-[TASK_NUM].
  - requirements_version.file points to ../requirements.md (never ../requirement.md).
  - covers.acceptance_criteria contains only IDs present in the parent requirements.md trackable_items.
  - after[] contains only TASK-IDs; external blockers live in awaiting[].
  - plans_and_protocols/ exists as a sibling of goal.md.
  - No goal.md is written without a valid parent requirements.md (except explore tasks with a pre-allocated ID).

user_input_gates:
  - phase: "Step 1 — Understand the Requirement (if not provided)"
    description: "Developer provides the high-level objective and feature type when not already clear from the caller's context."
    decision_kind: free-text
    required: conditional
    condition: "Only fires in standalone mode when the requirement or goal is not already provided by the caller."
  - phase: "Step 3d — Existing Task Overlap Check"
    description: "Developer clarifies whether a potentially overlapping task found in the repo is a duplicate, an extension, or genuinely independent."
    decision_kind: path-selection
    required: conditional
    condition: "Only fires in standalone mode when Sub-check 1 or Sub-check 2 returns at least one overlap hit."
  - phase: "Step 4 — Reason and Propose Location"
    description: "Developer approves the proposed task folder location before the workspace is created."
    decision_kind: approval
    required: conditional
    condition: "Skipped in plan-driven mode; required in standalone mode."
  - phase: "Coverage Tracking — Ask which items this task implements"
    description: "Developer selects which acceptance criteria and sections from the parent requirement this task covers."
    decision_kind: selection
    required: conditional
    condition: "Only fires in standalone mode when the parent requirements.md has trackable_items; skipped in plan-driven mode."
  - phase: "Package Inheritance — mixed/no package assignment"
    description: "Developer selects which release package this task targets when covered ACs have mixed or no package assignments."
    decision_kind: selection
    required: conditional
    condition: "Only fires in standalone mode when covered items have mixed packages or no assignments."
  - phase: "Step b.5 — Dependency proposal (propose_after.py)"
    description: "Developer accepts or drops proposed after: dependency entries and optionally adds others."
    decision_kind: revision
    required: conditional
    condition: "Only fires in interactive mode when propose_after.py returns at least one proposal."
  - phase: "Step c — impl task release_description"
    description: "Developer confirms or adjusts the AI-drafted release description (max 25 words, user-benefit perspective)."
    decision_kind: revision
    required: conditional
    condition: "Only fires for impl task type in standalone mode."
  - phase: "Cascade Task Detection — multi-pass structure question"
    description: "Developer confirms whether the task should be structured as a multi-pass cascade task."
    decision_kind: approval
    required: conditional
    condition: "Only fires when cascade task keywords or patterns are detected."
  - phase: "Priority Determination — urgency/impact questions (no parent priority)"
    description: "Developer answers guiding questions to set urgency and impact when the parent requirement has no existing priority."
    decision_kind: free-text
    required: conditional
    condition: "Only fires when the parent requirement has no urgency/impact values."
  - phase: "Step 3 — Non-approved flow warning"
    description: "Developer explicitly confirms to proceed when a referenced user flow is not approved, accepting the rework risk."
    decision_kind: approval
    required: conditional
    condition: "Only fires when creating tasks that implement user flows AND the referenced flow is not approved."
  - phase: "Sizing Gate (REQ-PROC-001 AC-03)"
    description: "Developer chooses how to resolve a high-volume task that triggers the sizing gate: recommend Opus, split into child tasks, or add a named fan-out plan."
    decision_kind: selection
    required: conditional
    condition: "Only fires in interactive mode when expected_tool_calls > 60 or skill_chain_depth >= 4 and none of the three end states is already satisfied."

may_invoke:
  - requ-explore          # Case A — no requirements.md and task type is not explore
  - task-derive-from-requ # redirect when uncovered ACs are detected in standalone mode (AC-10)

side_effects:
  - target: requirements_tasks/<req>/tasks/.reserve-<TASK-ID>
    action: write
    note: Atomic marker created during ID allocation; deleted after goal.md is written.
  - target: requirements_tasks/<req>/.reserve-<REQ-ID>
    action: write
    note: Atomic marker created if an explore task pre-allocates a requirement ID (Case A).
  - target: requirements_tasks/_meta/id_registry.md
    action: regenerate
    note: Regenerated at task-start via generate_id_registry.py --requirements.

preconditions:
  - A parent requirements.md exists (or an explore task pre-allocates its requirement ID).
  - id_registry.md is regenerated so the allocated task ID cannot collide.

postconditions:
  - A goal.md conforming to goal_metadata.yaml exists with a unique task_id and a sibling plans_and_protocols/.
  - All reservation markers created during allocation have been deleted.
