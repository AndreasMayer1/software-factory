- id: ADV-analyze-ideate-03
  kind: gap
  title: harvest_coherence_safety as a hard knockout may be too strict — layers 
    committed before the interruption are coherent; per-commit partial harvest 
    may be safe (open question for gate).
  status: open
  gap_type: adversarial
