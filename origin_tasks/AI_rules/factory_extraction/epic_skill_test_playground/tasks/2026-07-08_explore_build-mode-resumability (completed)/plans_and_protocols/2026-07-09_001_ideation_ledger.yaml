meta:
  original_problem: 'Make a DEPLOYED build-mode layer-derivation run resumable across
    session termination / usage-limit hits (start -> terminate -> resume). Today build.py::run_build_mode
    is single-shot: it launches ONE contained claude -p child, then unconditionally
    records cost -> harvest_authored -> shutil.rmtree(copy) with no check on LaunchResult.returncode/.reason,
    so an interrupted run harvests a partial (possibly incoherent) deposit into test_harness_app/
    AND destroys the copy that held resumable state. Additionally (developer input
    01): the derivation task may itself run under the OUTER autorun orchestrator while
    the deployed copy contains its OWN inner orchestrator, so pausing must coordinate
    both; and the pause/resume mechanism should generalize to all long build-mode
    playground runs, not just layer-derivation.'
  effort: Standard
  effort_signals:
    U_unknowns: 5
    L_layers: 4
    R_reversal_cost: low (design stage — nothing deployed; fully reversible 
      pre-impl)
    N_prior_art: yes (local chain already resumable; outer orchestrator already 
      has rate-limit/resume model)
    note: L>=2 would push Deep, but strong prior art (N=yes) + low reversal cost
      at design stage + well-bounded named unknowns => Standard chosen 
      deliberately.
  frames:
  - software_architect
  - security_privacy_auditor
  - product_manager
  - distributed_systems_checkpoint_restart
  - biology_hibernation
  stakeholder_mode: factory
  persona_frame_binding: the factory developer/operator who launches and resumes
    playground build-mode runs
  seed_candidate:
  min_ideas: 25
  max_iter: 2
  max_alternation: 2
  placement: inline
  placement_inputs:
    effort: Standard
    rationale: 'Divergence run INLINE rather than leaf-isolated: automated-mode session
      under a pro-tier SEQUENTIAL-spawn policy makes many sequential Opus divergence-leaf
      spawns the dominant usage-limit/cost risk (the exact failure this task studies).
      The hosting session already holds the full gathered substrate, so inline divergence
      avoids re-read amplification and bounds the run to one context. Recorded as
      a deliberate deviation from the Standard leaf-isolate default (AC-08 placement).'
  parallelism: 'sequential (session-start policy: pro tier)'
  phase_tiers:
    diverge: inline-host
    synthesize: inline-host
    gapcheck: inline-host
    web_leaves: none
    scripts: none
  convergent_mode: inline-host
  topic_class: composition
  deviation_note: Faithful to the ideation workflow STRUCTURE and OUTPUTS 
    (ledger, gather, analyze+criteria+decompose, diverge, synthesize, report, 
    end-run gate). Divergence and gapcheck run inline in the hosting session 
    rather than as spawned agents, for the cost/limit reasons in 
    placement_inputs. Mid-run gate skipped (automated mode, AC-22).
  topic_class_rationale: The resume mechanism composes several co-designed parts
    (state-location + registry/re-attach + completion-signal + dual-orchestrator
    pause + generalization), not a pick among atomic candidates.
  alternation_log:
  - pass: 1
    dimensions_before: 0
    dimensions_after: 5
    new_surfaced: 5
    note: ''
  - pass: 2
    dimensions_before: 0
    dimensions_after: 5
    new_surfaced: 5
    note: ''
  gate_disposition: ACCEPTED (v2/SOL-02; D1-D6 as recommended, iteration 2)
  accepted_solution: SOL-02
  measures_schema_epoch: pre-AC-37
  measures_schema_epoch_note: Ledger predates the measures field (AC-37). 
    Spine/reuse-build/connotation-safety criteria were backfilled 
    deterministically by slug. Problem-specific criterion(s) CR-06, CR-07, 
    CR-08, CR-09 have no deterministic classification source and are left 
    unclassified rather than guessed — TASK-PROC-004-03-36 / 
    TASK-PROC-004-03-38.
rows:
- kind: constraint
  id: C1
  title: No git-reset; harvest-before-discard; discard is rmtree (topology 
    hazard T-B).
- kind: constraint
  id: C2
  title: Harvest is snapshot-diff scoped to net-new/modified (REQ-PROC-068-19).
- kind: constraint
  id: C3
  title: 'AC-10: whole-factory deploy must stay intact — copy must remain a runnable
    project.'
- kind: constraint
  id: C4
  title: 'AC-12: single shared ~/.claude auth window across the whole session tree.'
- kind: constraint
  id: C5
  title: Local derivation chain already resumable (ChainState + commit-per-unit 
    + resume skill).
- kind: constraint
  id: C6
  title: Outer orchestrator already detects rate limits and resumes in_progress 
    tasks.
- kind: constraint
  id: C7
  title: Depth-1 spawn topology; sequential-spawn on tight tier bounds loss to 
    one in-flight unit.
- id: CR-01
  kind: criterion
  slug: usefulness
  title: Usefulness / desirability
  weight: 3.0
  weight_rationale: Must actually unblock 068-12 and end the partial-harvest 
    hazard — the reason the task exists.
  direction: benefit
  role: spine
  provenance: internal
  kind_of_criterion: floored_weighted
  knockout_threshold: 3.0
  measures: value
- id: CR-02
  kind: criterion
  slug: feasibility
  title: Feasibility
  weight: 0.0
  weight_rationale: Knockout floor — a design that cannot be built on the 
    existing wrapper/chain/orchestrator is out.
  direction: benefit
  role: spine
  provenance: internal
  kind_of_criterion: knockout
  knockout_threshold: 3.0
  measures: value
- id: CR-03
  kind: criterion
  slug: viability
  title: Viability (effort / cost)
  weight: 2.0
  weight_rationale: Standard spine weight.
  direction: benefit
  role: spine
  provenance: internal
  kind_of_criterion: weighted
  measures: cost
- id: CR-04
  kind: criterion
  slug: novelty
  title: Novelty
  weight: 2.0
  weight_rationale: Standard spine weight.
  direction: benefit
  role: spine
  provenance: internal
  kind_of_criterion: weighted
  measures: value
- id: CR-05
  kind: criterion
  slug: risk
  title: Risk
  weight: 3.0
  weight_rationale: 'High weight: the dominant risk (incoherent partial deposit into
    test_harness_app/) is the whole motivation.'
  direction: cost
  role: spine
  provenance: internal
  kind_of_criterion: weighted
  measures: cost
- id: CR-06
  kind: criterion
  slug: operator_low_supervision
  title: A cold session re-attaches & resumes with no human threading paths by 
    hand
  weight: 2.5
  weight_rationale: 'Factory-operator primary need: unattended resume across sessions
    is the point of the mechanism.'
  direction: benefit
  role: problem_specific
  provenance: internal
  kind_of_criterion: weighted
  source: persona:factory-operator:user
- id: CR-07
  kind: criterion
  slug: state_durability
  title: Resume-state durability (survives rmtree, /tmp eviction, reboot, 
    shared-account limit)
  weight: 3.0
  weight_rationale: 'The core unknown: resumable state must outlive the discarded
    copy and a machine reboot.'
  direction: benefit
  role: problem_specific
  provenance: internal
  kind_of_criterion: weighted
- id: CR-08
  kind: criterion
  slug: harvest_coherence_safety
  title: Never deposits an incoherent partial harvest into test_harness_app/
  weight: 3.0
  weight_rationale: 'KNOCKOUT: a partial/incoherent deposit is actively harmful; any
    design that risks it is eliminated.'
  direction: benefit
  role: problem_specific
  provenance: internal
  kind_of_criterion: knockout
  knockout_threshold: 3.0
- id: CR-09
  kind: criterion
  slug: minimal_new_mechanism
  title: Reuses existing ChainState / resume-skill / orchestrator vs. new 
    bespoke machinery
  weight: 2.5
  weight_rationale: Smallest-change principle; the local chain and outer 
    orchestrator already solve most of this.
  direction: benefit
  role: problem_specific
  provenance: internal
  kind_of_criterion: weighted
- id: SP-01
  kind: subproblem
  parent_id: root
  title: SP-1 Durable resume-state location
  scope: 'Where cross-session resumable state lives when the isolated copy is normally
    discarded: preserve the copy keyed by a handle, re-hydrate a distilled ChainState+commits
    bundle into a fresh deploy, or a host-side registry pointing at preserved state.'
  interface_contract: Produces a durable state artifact (path + identity) that 
    SP-2's registry references and SP-3's completion signal is read from; must 
    survive rmtree, /tmp eviction, reboot.
  status: open
- id: SP-02
  kind: subproblem
  parent_id: root
  title: SP-2 Run registry & cold re-attach
  scope: The minimal durable run handle + a host-side registry of live deployed 
    runs; how a later cold session discovers an in-progress run and re-attaches 
    (re-launch contained child so inner autorun resumes from ChainState).
  interface_contract: Reads SP-1's state artifact; exposes a discover() a cold 
    session calls; drives the same contained-launch path build.py already uses; 
    hands completion decision to SP-3.
  status: open
- id: SP-03
  kind: subproblem
  parent_id: root
  title: SP-3 Explicit completion signal & harvest/discard gating
  scope: "What makes 'done' explicit and trustworthy enough to gate the irreversible
    harvest+discard (ChainState all-units-done / fixpoint marker / returncode contract).
    On incomplete exit: preserve copy, skip/mark-partial harvest."
  interface_contract: Reads SP-1 state + LaunchResult.returncode/.reason; emits 
    COMPLETE|INCOMPLETE; only COMPLETE authorizes harvest_authored + rmtree; 
    INCOMPLETE preserves state for SP-2.
  status: open
- id: SP-04
  kind: subproblem
  parent_id: root
  title: SP-4 Usage-limit checkpoint & dual-orchestrator coordination
  scope: 'Reframe a usage-limit hit as a planned pause: detect (returncode/reason
    + stdout marker under the shared ~/.claude window), checkpoint cleanly, and pause
    BOTH the outer autorun orchestrator (else it launches the next task) and the inner
    orchestrator inside the copy; resume after the window resets.'
  interface_contract: Consumes SP-3's INCOMPLETE(reason=limit) signal; signals 
    the outer orchestrator to hold this task in_progress (reuse 
    rate_limited/resume path); on resume triggers SP-2 re-attach.
  status: open
- id: SP-05
  kind: subproblem
  parent_id: root
  title: SP-5 Generalization to all long build-mode runs
  scope: Make SP-1..SP-4 a reusable build-mode pause/resume primitive that also 
    serves non-derivation playground use cases (a multi-task skill-under-test), 
    not derivation-specific wiring.
  interface_contract: Wraps SP-1..SP-4 behind a completion-signal + 
    state-location abstraction that build.py exposes for any long child run, 
    parameterized by the run's own completion predicate.
  status: open
- id: ADV-analyze-ideate-01
  kind: gap
  title: Re-launching the same contained child must SKIP deploy/seed/snapshot on
    resume, or it re-baselines the net-new harvest diff and corrupts harvest 
    scoping.
  status: open
  gap_type: adversarial
  phase: analyze
