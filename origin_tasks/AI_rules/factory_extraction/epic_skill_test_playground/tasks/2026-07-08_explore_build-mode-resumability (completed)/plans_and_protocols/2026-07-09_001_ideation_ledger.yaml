- id: ADV-synthesize-gate-01
  kind: gap
  title: The 'free outer pause' assumes the deployed run executes AS an outer 
    orchestrator in_progress task; if build.py is invoked as a plain CLI 
    subprocess (not via a goal.md task), there is no outer task to hold and the 
    free pause evaporates — the invocation contract must require the task-backed
    path.
  status: open
  gap_type: adversarial
  phase: synthesize
  boundary: synthesize→gate
- id: ADV-synthesize-gate-02
  kind: gap
  title: 'Contradiction with gathered constraint C4: a usage limit kills the WHOLE
    tree at once, including the host wrapper session; if build.py is killed mid-launch
    it never reaches the completion gate to preserve the copy. Therefore preservation
    must be the DEFAULT (durable dir + registry status=running written BEFORE launch),
    with discard only on verified COMPLETE — not an action on the incomplete branch.'
  status: open
  gap_type: adversarial
  phase: synthesize
  boundary: synthesize→gate
