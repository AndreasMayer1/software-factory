    sleeps (interruptibly) until reset then resumes where it left off — confirms the
    developer's 'freeze in time and resume' hypothesis for BOTH inner and outer orchestrators."
- kind: context
  id: G2-5
  title: deploy.py does NOT exclude automation/ — the deployed copy contains the
