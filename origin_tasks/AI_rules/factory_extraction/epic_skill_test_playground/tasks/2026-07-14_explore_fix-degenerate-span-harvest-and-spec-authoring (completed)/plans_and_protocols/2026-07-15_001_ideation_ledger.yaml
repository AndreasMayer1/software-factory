- id: ADV-synthesize-gate-01
  kind: gap
  title: VACUOUS-by-structural-proof relies on resolve_spans distinguishing a 
    genuinely-degenerate zero-pair span from a span that resolves to zero pairs 
    for a non-degenerate reason (e.g. task_code excluded from 
    AUTHORING_SKILL_BY_PAIR); if conflated, a span with real derivation intent 
    could be wrongly stamped VACUOUS and skip authoring — falsifies the 
    truthfulness score.
  status: open
  gap_type: adversarial
  phase: synthesize
  boundary: synthesize→gate
- id: ADV-synthesize-gate-02
  kind: gap
  title: The pre-flight predicts the oracle verdict assuming all real-authoring 
    spans reach DONE; a real span that can NEVER reach DONE for a structural 
    reason (no authoring skill registered for its pair) still yields a best-case
    'harvestable' prediction, so that class of doomed spec is NOT caught at plan
    time — contradicts SP-3's stated guarantee.
  status: open
  gap_type: adversarial
  phase: synthesize
  boundary: synthesize→gate
- id: ADV-synthesize-gate-03
  kind: gap
  title: Migrating persisted ESCALATED('gate_content_fail') units to VACUOUS at 
    load risks silently reclassifying a REAL past gate failure if the migration 
    keys only on current span structure and not on whether authoring pairs 
    existed when the unit escalated.
  status: open
