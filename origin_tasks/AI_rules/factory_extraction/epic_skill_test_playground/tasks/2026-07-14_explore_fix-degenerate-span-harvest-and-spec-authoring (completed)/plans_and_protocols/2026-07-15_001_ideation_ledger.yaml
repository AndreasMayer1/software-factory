- id: CR-01
  kind: criterion
  slug: usefulness
  title: Usefulness / desirability
  weight: 0.22
  weight_rationale: Does the design actually let a legitimately-complete chain 
    harvest AND keep the real abandonment guarantee — the whole point.
  direction: benefit
  role: spine
  provenance: internal
  kind_of_criterion: floored_weighted
  knockout_threshold: 3.0
  measures: value
- id: CR-02
  kind: criterion
  slug: feasibility
  title: Feasibility
  weight: 0.18
  weight_rationale: Can it be built within the existing mechanism/oracle/skill 
    surface without a large rewrite.
  direction: benefit
  role: spine
  provenance: internal
  kind_of_criterion: knockout
  knockout_threshold: 3.0
  measures: value
- id: CR-03
  kind: criterion
  slug: viability
  title: Viability (effort / cost)
  weight: 0.12
  weight_rationale: 'Ongoing effort/cost: does it avoid per-spec workarounds and stay
    cheap to maintain.'
  direction: benefit
  role: spine
  provenance: internal
  kind_of_criterion: weighted
  measures: cost
- id: CR-04
  kind: criterion
  slug: novelty
  title: Novelty
  weight: 0.05
  weight_rationale: Minor for internal tooling; slight credit for a cleaner 
    primitive.
  direction: benefit
  role: spine
  provenance: internal
  kind_of_criterion: weighted
  measures: value
- id: CR-05
  kind: criterion
  slug: risk
  title: Risk
  weight: 0.15
  weight_rationale: Blast radius at the HIGH-consequence AC-18 seam; chance of 
    masking a real under-finish.
  direction: cost
  role: spine
  provenance: internal
  kind_of_criterion: weighted
  measures: cost
- id: CR-06
  kind: criterion
  slug: truthfulness
  title: Truthfulness of the completion signal
  weight: 0.2
  weight_rationale: A degenerate span must report what is TRUE (nothing-to-do), 
    never a fake DONE that hides a real under-finish. Central to the HIGH EGP-F 
    AC-18 intent.
  direction: benefit
  role: problem_specific
  provenance: internal
  kind_of_criterion: weighted
- id: CR-07
  kind: criterion
  slug: provider_teachability
  title: Teachability to the LLM spec-author
  weight: 0.08
  weight_rationale: The App-Provider/maintaining role needs an LLM to author 
    correct specs without hand-holding; the design must be explainable in a 
    small governed artifact.
  direction: benefit
  role: problem_specific
  provenance: internal
  kind_of_criterion: weighted
  source: persona:PERSONA-015:affected
- id: SP-01
  kind: subproblem
  parent_id: root
  title: Fix locus for the degenerate zero-authoring-pair span
  scope: 'WHERE the class is resolved: (a) mechanism — a degenerate span completes
    vacuously DONE (distinct disposition or DONE); (b) oracle tolerance — chainstate
    oracle counts a degenerate/no-op unit as satisfied; (c) upstream — plan_chain/resolve_spans
    do not emit a unit for a zero-pair span. Chosen locus must not touch span-1 real
    authoring/harvest and must not weaken the strict all-DONE guarantee for REAL under-finish.'
  interface_contract: Produces the ground-truth disposition/label that SP-2 
    (AC-18/19) names, that SP-3 (pre-flight) simulates, and that SP-4 (authoring
    surface) teaches. Must leave span-1 semantics and the real-abandonment path 
    unchanged.
  status: open
- id: SP-02
  kind: subproblem
  parent_id: root
  title: AC-18/AC-19 clarification (exclude degenerate no-op from 
    abandonment/blame)
  scope: 'Reword/extend AC-18 so a mandatory zero-authoring-pair span is NOT classified
    abandoned nor blamed on the skill-under-test, while KEEPING true: abandoned =
    the skill-under-test silently under-finished real authoring. Keep AC-19 (no-oracle
    => cannot certify; background-agent-in-flight => not clean-complete) intact. HIGH-consequence
    EGP-F.'
  interface_contract: Consumes the disposition SP-1 emits (names the same thing 
    the mechanism/oracle produces). The externally-grounded referent for AC-18 
    stays a real run observed vs the playground classification.
  status: open
- id: SP-03
  kind: subproblem
  parent_id: root
  title: Harvestability pre-flight contract + placement
  scope: A plan-time guardrail that turns "plan-success != harvestable" into a 
    loud plan-time failure. WHAT it simulates (span resolution + per-span 
    disposition + oracle prediction), WHERE it lives (plan_chain / build.py / 
    layer-derivation-start), how much it simulates, and how resume paths cannot 
    skip it (ADV-sg-06).
  interface_contract: Consumes the span/unit + disposition model from SP-1; must
    be reachable on BOTH -start and resume; emits a distinct exit/failure so an 
    un-harvestable spec never reaches a deployed run.
  status: open
- id: SP-04
  kind: subproblem
  parent_id: root
  title: Spec-authoring surface for the LLM author
  scope: 'Smallest artifact reliably teaching an LLM the span<->unit mapping and the
    degenerate-span rule: dedicated skill vs extend layer-derivation-start + a governed
    spec template/contract. NOT doc/ (skill/mechanism layer only).'
  interface_contract: Teaches exactly the model SP-1 formalizes and SP-3 checks;
    its correctness is the same rule the pre-flight enforces (author-time 
    guidance and plan-time gate agree).
  status: open
- id: ADV-analyze-ideate-01
  kind: gap
  title: "SP-1's 'mechanism vacuous-DONE / distinct disposition' option is not checked
    against the existing fail-closed content-gate poka-yoke (backfill_orchestration.py
    _resolve_gate_outcome, WHY comment L865-871: 'a run with no real judge wired can
    never reach DONE') — a degenerate span reaching a DONE-like state without a real
    content gate risks reopening exactly the hole that poka-yoke was built to close;
    SP-1 scope text omits this as a constraint to preserve."
  status: open
  gap_type: adversarial
  phase: analyze
  boundary: analyze→ideate
- id: ADV-analyze-ideate-02
  kind: gap
  title: Context summary cites ONE test comment 
    (test_backfill_orchestration.py:1061) as proof ESCALATED-skip is 'the 
    mechanism's own unit test documents this as intended', but the 
    ESCALATED='skip past this unit' pattern is baked into at least 7 test sites 
    (lines 213,228,234,556,763,1061,1201) covering generic missing-answer AND 
    gate_content_fail escalation, not just degenerate spans — the test-migration
    blast radius of introducing a new disposition is understated and 
    single-sourced from one comment.
  status: open
  gap_type: adversarial
  phase: analyze
  boundary: analyze→ideate
- id: ADV-analyze-ideate-03
  kind: gap
  title: "No subproblem owns layer-derivation-status: its contract.yaml quality_criteria
    ('ESCALATED units include their pending_feedback path when detectable via grep')
    and SKILL.md example line ('[ESCALATED] ... awaiting answer: automation/pending_feedback/...')
    already misreport a degenerate span's ESCALATED('gate_content_fail') as 'awaiting
    a developer answer' when no pending_feedback file exists for it — this existing
    reporting surface needs updating in lockstep with whatever new disposition SP-1
    chooses, but SP-1/SP-2/SP-4 never name it."
  status: open
  gap_type: adversarial
  phase: analyze
  boundary: analyze→ideate
- id: ADV-analyze-ideate-04
  kind: gap
  title: 'Unconsidered configuration: the framing only examines a BIDIRECTIONAL adjacent-fixed
    degenerate span (persona-scenario). resolve_spans also produces FORWARD/REVERSE
    degenerate zero-pair spans when a single fixed layer sits immediately adjacent
    to a chain terminus (e.g. fixed_layers=[task] -> task->code span), AND a separate
    zero-boundary path exists because task_code pairs are explicitly filtered out
    of AUTHORING_SKILL_BY_PAIR (confirmed by test_task_code_boundary_is_excluded)
    — neither direction-generality nor the task_code-exclusion path is addressed by
    SP-1.'
  status: open
  gap_type: adversarial
  phase: analyze
  boundary: analyze→ideate
- id: ADV-analyze-ideate-05
  kind: gap
  title: "Unconsidered configuration: SP-1's scope text ('must not touch span-1 real
    authoring/harvest') implicitly assumes exactly one degenerate span plus one real
    span. resolve_spans's own table shows N fixed layers (edges included) yield N-1
    spans, so a chain can have multiple degenerate spans interspersed with real ones
    (degenerate span NOT at index 0, e.g. mid-chain) or be entirely degenerate (every
    span zero-pair) — no subproblem specifies whether an all-degenerate chain should
    harvest-as-trivially-complete or be rejected upstream by the SP-3 pre-flight as
    a malformed spec."
  status: open
  gap_type: adversarial
  phase: analyze
  boundary: analyze→ideate
- id: ADV-analyze-ideate-06
  kind: gap
  title: "Missing sub-problem: chain-state migration. TASK-PROC-068-26/068-12 already
    persisted real on-disk ChainState files where span-0 was hand-driven to a truthful
    DONE via the Option-A workaround (not via any new mechanism disposition); other
    in-flight/abandoned chains may hold a unit already recorded ESCALATED('gate_content_fail')
    for a degenerate span from before the fix ships. No subproblem addresses whether/how
    layer-derivation-resume, -status, or the harvest oracle re-interpret pre-existing
    persisted ESCALATED units under the new rule, vs only covering newly-planned chains
    going forward."
  status: open
  gap_type: adversarial
  phase: analyze
  boundary: analyze→ideate
- id: ADV-analyze-ideate-07
  kind: gap
  title: "Un-gathered reuse candidate misrepresented as available: the analysis's
    'early design observations' frame screen_derivability/DerivabilityError (anchor_span_engine.py)
    as one of 'two adjacent primitives to build on', but grep confirms backfill_orchestration.py
    (the module actually wired into build.py's oracle and layer-derivation-start/-resume,
    i.e. the real production path that hit the 068-26 defect) never imports or calls
    screen_derivability, DerivabilityError, or run_spans — that machinery is dead
    code for this bug's call path, only exercised via anchor_span_engine's own CLI/tests,
    so 'extending' it would not touch the flow that actually needs fixing unless a
    separate, unscoped wiring change is also made."
  status: open
  gap_type: adversarial
  phase: analyze
  boundary: analyze→ideate
