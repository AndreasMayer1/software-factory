contract_version: 1
skill: task-create
purpose: >
  Initialize a task workspace inside requirements_tasks/ — the primary PRODUCER of
  goal.md files consumed by every implementation and exploration skill. Validates
  requirement coverage, allocates a unique task ID atomically, and writes the canonical
  goal.md frontmatter + body structure. All downstream skills depend on this output.

derived_from:
  required:
    - path: requirements_tasks/<category>/<req>/requirements.md
      source: external   # developer-authored or produced by requ-explore (not within this skill)
      schema: null
      role: parent requirement — reads id, trackable_items.acceptance_criteria, urgency, impact for inheritance
    - path: requirements_tasks/_meta/id_registry.md
      source: external   # generated by generate_id_registry.py script, not a skill output
      schema: null
      role: requirement ID lookup; regenerated just-in-time before task ID allocation
  optional:
    - path: requirements_tasks/RELEASE_BACKLOG.md
      source: external   # developer-maintained release planning document
      schema: null
      role: available package IDs for target_package field population
    - path: requirements_user_needs/user_flows/<flow>/flow.md
      schema: null
      role: review_status check when task implements a user flow
    - path: requirements_user_needs/README_8_CROSS-REFERENCING_SYSTEMS.md
      schema: null
      role: bidirectional link conventions; read when task implements a user flow
    - path: requirements_user_needs/README_12_REVIEW_STATUS.md
      schema: null
      role: flow review status rules; read when task implements a user flow
    - path: requirements_user_needs/README_13_CROSS_REFERENCE_NOTATION.md
      schema: null
      role: reference notation; read when task implements a user flow
    - path: plans_and_protocols/cascade_log.md
      source: external   # written by this skill itself on prior run; not another skill's output
      schema: null
      role: cascade task context; present only for cascade-type tasks (written by this skill)

produces:
  required:
    - path: requirements_tasks/<category>/<req>/<feature>/tasks/<task>/goal.md
      schema: .claude/schemas/goal_metadata.yaml
      role: >
        THE primary shared artifact consumed by every skill that executes work.
        Frontmatter carries task_id, type, parent_requirement, covers, effort, status,
        after, opus_recommended, and all other fields defined in the goal_metadata schema.
    - path: requirements_tasks/<category>/<req>/<feature>/tasks/<task>/plans_and_protocols/
      schema: null
      role: empty directory — cross-session memory home for all protocol.md and plan files
  conditional:
    - path: requirements_tasks/<category>/<req>/<feature>/tasks/<task>/plans_and_protocols/cascade_log.md
      condition: written only when cascade_type == user_needs and user confirmed multi-pass mode
      schema: null
      role: cascade pass tracker; read by each cascade pass agent before starting
    - path: requirements_tasks/<category>/<req>/<feature>/tasks/<task>/plans_and_protocols/<YYYY-MM-DD>_00_user_initial_input.md
      condition: written only when task type == explore
      schema: null
      role: verbatim user seed input; referenced from goal.md Background section

side_effects:
  - target: requirements_tasks/<req>/tasks/.reserve-<TASK-ID>
    write: atomic marker created during ID allocation; deleted after goal.md is written
  - target: requirements_tasks/<req>/.reserve-<REQ-ID>
    write: atomic marker created if explore task pre-allocates a requirement ID (Case A)
  - target: requirements_tasks/_meta/id_registry.md
    write: regenerated at task-start via generate_id_registry.py --requirements

may_invoke:
  - requ-explore       # when Case A (no requirements.md) and task type is NOT explore
  - task-derive-from-requ  # redirect when uncovered ACs detected in standalone mode (AC-10)

quality_criteria:
  - goal.md exists at the declared path with valid YAML frontmatter after skill exits
  - task_id follows pattern TASK-[CATEGORY]-[REQ_NUM]-[TASK_NUM]
  - requirements_version.file points to ../requirements.md (not ../requirement.md)
  - covers.acceptance_criteria contains only IDs that exist in parent requirements.md trackable_items
  - after[] contains only TASK-IDs, never external-blocker descriptions (those go in awaiting[])
  - plans_and_protocols/ directory exists at the correct sibling path to goal.md
  - No goal.md written without a valid parent requirements.md (except explore type with pre-allocated ID)
